# Official Flutter localization (gen-l10n). Generated code is committed under
# lib/l10n/generated; regenerate with `flutter gen-l10n` after editing the ARB
# files. pt is the template and the final fallback.
arb-dir: lib/l10n
template-arb-file: app_pt.arb
output-dir: lib/l10n/generated
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
preferred-supported-locales: [pt, en, es]
