<!-- Bebômetro · auth e-mail "recovery" · pt-BR only.
     Code only: no link and no button (the app asks for the 6-digit code).
     Centered with a table (align="center"), which e-mail clients honor more than "margin:0 auto" on a div.
     Subject: Redefinir senha -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" align="center" style="width:100%;background:#ffffff">
  <tr>
    <td align="center" style="padding:24px 16px">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" border="0" align="center" style="width:100%;max-width:480px;font-family:Arial,Helvetica,sans-serif;color:#222;line-height:1.5">
        <tr>
          <td align="center" style="padding:0 0 16px;font-size:14px;font-weight:700;color:#C77D0A">Bebômetro</td>
        </tr>
        <tr>
          <td align="center" style="padding:0 0 8px;font-size:22px;font-weight:700;color:#151311">Seu código para redefinir a senha</td>
        </tr>
        <tr>
          <td align="center" style="padding:0 0 8px;font-size:14px">Digite este código no app Bebômetro para criar uma nova senha:</td>
        </tr>
        <tr>
          <td align="center" style="padding:12px 0">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="width:100%">
              <tr>
                <td align="center" style="padding:16px;background:#FFF4DC;border-radius:8px;font-size:32px;font-weight:700;letter-spacing:8px;color:#151311">{{ .Token }}</td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:8px 0 0;font-size:13px;color:#555">O código expira em pouco tempo. Se você não pediu, pode ignorar este e-mail.</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
