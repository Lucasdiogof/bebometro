name: bebometro
description: "Bebômetro: registre bebidas, gastos e o histórico dos seus rolês."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: '>=3.13.0-0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  flutter_map: ^8.2.1
  geolocator: ^14.0.2
  get_it: ^8.0.3
  google_mlkit_text_recognition: ^0.17.1
  http: ^1.4.0
  image: ^4.5.4
  image_picker: ^1.2.4
  intl: any
  latlong2: ^0.9.1
  path_provider: ^2.1.5
  sensors_plus: ^7.1.1
  share_plus: ^10.1.4
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.9.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # gen-l10n (l10n.yaml): pt-BR, en, es.
  generate: true

  assets:
    - assets/branding/
    - assets/catalog/
    - assets/games/
    # Full-screen beer textures (generated by tools/beer_textures/generate.py).
    - assets/glass/

  # Runtime fragment shader of the full-screen beer.
  shaders:
    - shaders/beer.frag
